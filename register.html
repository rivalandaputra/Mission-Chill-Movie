<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Daftar - Chill</title>


    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Lato:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">

</head>


<body class="auth-page register-page">


    <div class="auth-card">


        <div class="auth-logo">

            <img
                src="assets/logo.png"
                alt="Chill"
            >

        </div>


        <h1>
            Daftar
        </h1>


        <p class="auth-subtitle">
            Selamat datang!
        </p>


        <form id="registerForm">


            <div class="form-group">

                <label>
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    placeholder="Masukkan username"
                >

            </div>


            <div class="form-group">

                <label>
                    Password
                </label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        id="password"
                        placeholder="Masukkan password"
                    >

                </div>

            </div>


            <div class="form-group">

                <label>
                    Konfirmasi Password
                </label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Masukkan ulang password"
                    >

                </div>

            </div>


            <div class="auth-options">

                <span></span>

                <a href="login.html">
                    Sudah punya akun? Masuk
                </a>

            </div>


            <button
                type="submit"
                class="auth-submit"
            >
                Daftar
            </button>


        </form>


        <div class="divider">
            Atau
        </div>


        <button class="google-button">
            G &nbsp; Daftar dengan Google
        </button>


    </div>

</body>

</html>
